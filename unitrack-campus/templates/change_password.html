{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="text-center fw-bold mb-1">🔒 Change Password</h3>
            <p class="text-muted text-center small mb-4">Account: <strong>{{ current_user.username }}</strong></p>

            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Current (Old) Password</label>
                    <input type="password" name="old_password" class="form-control" required placeholder="Enter current password" autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">New Password</label>
                    <input type="password" name="new_password" class="form-control" required placeholder="Enter new password">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Re-enter new password">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
