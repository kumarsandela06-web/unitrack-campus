{% extends 'base.html' %}

{% block content %}
<style>
    .page-title {
        font-size: 26px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        margin-top: 30px;
    }

    .page-sub {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 25px;
    }

    /* Cream Paper Ticket Card */
    .ticket-card {
        background-color: #fcfaf5;
        border-radius: 16px;
        padding: 34px 38px;
        color: #1e293b;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    .ticket-tag {
        position: absolute;
        top: 28px;
        right: 38px;
        border: 1px solid #ef4444;
        color: #ef4444;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        padding: 4px 10px;
        border-radius: 6px;
    }

    .form-label-custom {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.8px;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .form-control-custom, .form-select-custom {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        color: #0f172a;
        width: 100%;
    }

    .form-control-custom:focus, .form-select-custom:focus {
        border-color: #38bdf8;
        outline: none;
    }

    .btn-register-submit {
        background-color: #0f2744;
        color: #ffffff;
        font-weight: 700;
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
    }
</style>

<div class="container py-3">
    <h2 class="page-title">Register a Complaint</h2>
    <p class="page-sub">Fill in the details below — a ticket ID is generated automatically.</p>

    <div class="ticket-card mb-5">
        <span class="ticket-tag">NEW TICKET</span>

        <form method="POST" action="{{ url_for('report_problem') }}">
            <div class="row g-4">
                <!-- Row 1: Student Name & Department -->
                <div class="col-md-6">
                    <label class="form-label-custom">Student Name</label>
                    <input type="text" name="student_name" class="form-control-custom" placeholder="e.g. Rahul Sharma" value="{{ current_user.username if current_user.is_authenticated else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Department</label>
                    <select name="department" class="form-select form-select-custom" required>
                        <option value="" disabled selected>Select department</option>
                        <option value="BCA">BCA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="MCA">MCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Sc">B.Sc</option>
                    </select>
                </div>

                <!-- Row 2: Building & Room No -->
                <div class="col-md-6">
                    <label class="form-label-custom">Building</label>
                    <select name="building" class="form-select form-select-custom" required>
                        <option value="" disabled selected>Select building</option>
                        {% for b in buildings %}
                        <option value="{{ b }}">{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Room No.</label>
                    <input type="text" name="room_no" class="form-control-custom" placeholder="e.g. 204" required>
                </div>

                <!-- Row 3: Category & Priority -->
                <div class="col-md-6">
                    <label class="form-label-custom">Category</label>
                    <select name="category" class="form-select form-select-custom" required>
                        <option value="" disabled selected>Select category</option>
                        {% for c in categories %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Priority</label>
                    <select name="priority" class="form-select form-select-custom" required>
                        <option value="" disabled selected>Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <!-- Row 4: Problem Description -->
                <div class="col-12">
                    <label class="form-label-custom">Problem Description</label>
                    <textarea name="problem" class="form-control-custom" rows="3" placeholder="Describe what's wrong, e.g. 'Ceiling fan makes a loud noise and doesn't reach full speed.'" required></textarea>
                </div>

                <div class="col-12 d-flex align-items-center gap-3 pt-2">
                    <button type="submit" class="btn-register-submit">Register complaint</button>
                    <span class="text-muted small">Date & ticket ID are assigned automatically on submit.</span>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
