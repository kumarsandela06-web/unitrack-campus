{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="kpi-card shadow-sm p-4 text-center">
            <h3 class="fw-bold mb-2 text-light">Verify Your Email</h3>
            <p class="text-secondary small mb-4">
                We sent a 6-digit confirmation code to <strong class="text-info">{{ email }}</strong>
            </p>
            <form method="POST" action="{{ url_for('verify_email') }}">
                <div class="mb-4">
                    <label class="kpi-label mb-2 d-block">Enter 6-Digit Code</label>
                    <input type="text" name="otp" maxlength="6" class="form-control text-center bg-dark text-light border-secondary fs-4 fw-bold" style="letter-spacing: 6px;" placeholder="123456" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Verify & Create Account</button>
            </form>
            <div class="mt-3">
                <a href="{{ url_for('register') }}" class="text-secondary small text-decoration-none">Back to Registration</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
